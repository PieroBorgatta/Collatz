name: Tower binary carry state

on:
  workflow_dispatch:
  push:
    paths:
      - 'notes/post_v6_binary_carries_2026-09-26/**'
      - 'notes/post_v6_margin_2026-09-25/margin_results.json'
      - 'notes/post_v6_renewal_2026-09-26/renewal_results.json'
      - 'notes/post_v6_seven_ancestors_2026-09-26/seven_results.json'
      - '.github/workflows/tower-binary-carries.yml'
  pull_request:
    paths:
      - 'notes/post_v6_binary_carries_2026-09-26/**'
      - 'notes/post_v6_margin_2026-09-25/margin_results.json'
      - 'notes/post_v6_renewal_2026-09-26/renewal_results.json'
      - 'notes/post_v6_seven_ancestors_2026-09-26/seven_results.json'
      - '.github/workflows/tower-binary-carries.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently check carries, collisions and finite fibers
        run: python3 notes/post_v6_binary_carries_2026-09-26/test_binary_carries.py
      - name: Reproduce exact bounded experiment
        run: |
          python3 notes/post_v6_binary_carries_2026-09-26/binary_carry_probe.py --output /tmp/binary-carries/binary_carry_results.json
          cmp notes/post_v6_binary_carries_2026-09-26/binary_carry_results.json /tmp/binary-carries/binary_carry_results.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-binary-carries-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/binary-carries
          if-no-files-found: ignore

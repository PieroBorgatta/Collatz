name: Tower global margins

on:
  workflow_dispatch:
  push:
    paths:
      - 'notes/post_v6_margin_2026-09-25/*.py'
      - 'notes/post_v6_margin_2026-09-25/*_results.json'
      - 'notes/post_v6_compensation_2026-09-25/block_engine.py'
      - 'notes/post_v6_compensation_2026-09-25/calibration_results.json'
      - 'notes/post_v6_compensation_2026-09-25/holdout_results.json'
      - 'notes/post_v6_certificates_2026-09-24/certificate_results.json'
      - 'notes/post_v6_arithmetic_2026-09-25/arithmetic_probe.py'
      - '.github/workflows/tower-margin.yml'
  pull_request:
    paths:
      - 'notes/post_v6_margin_2026-09-25/**'
      - '.github/workflows/tower-margin.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact budgets and quadratic lifts
        run: python3 notes/post_v6_margin_2026-09-25/test_margin.py
      - name: Reproduce all margins and integer counterexamples
        run: |
          python3 notes/post_v6_margin_2026-09-25/margin_probe.py --output /tmp/margin/margin_results.json
          cmp notes/post_v6_margin_2026-09-25/margin_results.json /tmp/margin/margin_results.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-margin-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/margin
          if-no-files-found: ignore

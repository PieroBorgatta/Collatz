name: Tower exact prefix propagation

on:
  workflow_dispatch:
  push:
    paths:
      - 'notes/post_v6_propagation_2026-09-25/*.py'
      - 'notes/post_v6_propagation_2026-09-25/*_results.json'
      - 'notes/post_v6_ternary_2026-09-25/ternary_probe.py'
      - 'notes/post_v6_ternary_2026-09-25/ternary_results.json'
      - '.github/workflows/tower-propagation.yml'
  pull_request:
    paths:
      - 'notes/post_v6_propagation_2026-09-25/**'
      - 'notes/post_v6_ternary_2026-09-25/ternary_probe.py'
      - 'notes/post_v6_ternary_2026-09-25/ternary_results.json'
      - '.github/workflows/tower-propagation.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact quotients, tails and independent integer oracles
        run: python3 notes/post_v6_propagation_2026-09-25/test_propagation.py
      - name: Reproduce propagated prefixes and carry identities
        run: |
          python3 notes/post_v6_propagation_2026-09-25/propagation_probe.py --output /tmp/propagation/propagation_results.json
          cmp notes/post_v6_propagation_2026-09-25/propagation_results.json /tmp/propagation/propagation_results.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-propagation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/propagation
          if-no-files-found: ignore

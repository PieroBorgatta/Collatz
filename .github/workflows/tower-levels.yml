name: Tower levels experiment

on:
  workflow_dispatch:
  push:
    paths:
      - 'notes/post_v6_levels_2026-09-24/*.py'
      - 'notes/post_v6_levels_2026-09-24/levels_results.json'
      - 'notes/post_v6_levels_2026-09-24/limit_prefix.json'
      - 'notes/post_v6_descent_2026-09-24/descent_cases.csv'
      - '.github/workflows/tower-levels.yml'
  pull_request:
    paths:
      - 'notes/post_v6_levels_2026-09-24/**'
      - 'notes/post_v6_descent_2026-09-24/descent_cases.csv'
      - '.github/workflows/tower-levels.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test precision boundaries and censoring
        run: python3 notes/post_v6_levels_2026-09-24/test_levels.py
      - name: Repeat exact experiment and compare results
        run: |
          python3 notes/post_v6_levels_2026-09-24/levels_probe.py --output-dir /tmp/tower-levels
          cmp notes/post_v6_levels_2026-09-24/levels_results.json /tmp/tower-levels/levels_results.json
          cmp notes/post_v6_levels_2026-09-24/limit_prefix.json /tmp/tower-levels/limit_prefix.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-levels-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tower-levels
          if-no-files-found: ignore

name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published PDF checksums
        run: python3 scripts/check_published_pdfs.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: 'true'
          # Lean 4.29.1 gives each native_decide proof a separate axiom.
          # Allow only the nine finite checks already present in the project;
          # sorryAx and any new axiom remain forbidden.
          axiom-audit: 'true'
          axiom-audit-allow: >-
            propext,Classical.choice,Quot.sound,
            CollatzShadowing.smallOddHasDirectDropWithin100Bool._native.native_decide.ax_1_1,
            CollatzShadowing.smallOddHasDirectDropWithin100Bool464._native.native_decide.ax_1_1,
            CollatzShadowing.smallOddHasDirectDropWithin100Bool648._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14Prototype_allValid._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_rowCount._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_allValid._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_allValidAtCutoff455._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_matches_summary._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixT14PairCoverageV2Lt8Cap100_summary._native.native_decide.ax_1_1
      - name: Check exact tower parameter experiments
        run: |
          python3 notes/post_v6_transport_2026-09-24/transport_probe.py --output /tmp/tower-transport-results.json
          cmp notes/post_v6_transport_2026-09-24/transport_results.json /tmp/tower-transport-results.json
      - name: Audit tower theorem dependencies
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean ../notes/post_v6_transport_2026-09-24/DependencyAudit.lean | tee /tmp/tower-dependency-audit.log
      - name: Preserve tower verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/tower-transport-results.json
            /tmp/tower-dependency-audit.log
          if-no-files-found: ignore
      - name: Audit descent and quadratic transfer without native axioms
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean ../notes/post_v6_induction_2026-09-25/DependencyAudit.lean | tee /tmp/descent-transfer-audit.log
      - name: Preserve descent and transfer audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: descent-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/descent-transfer-audit.log
          if-no-files-found: ignore
      - name: Audit prefix optimality and sibling packing without native axioms
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean ../notes/post_v6_reset_2026-09-26/PrefixDependencyAudit.lean | tee /tmp/prefix-optimality-audit.log
          lake env lean ../notes/post_v6_reset_2026-09-26/SiblingDependencyAudit.lean | tee /tmp/sibling-basin-audit.log
      - name: Replay finite sibling-basin diagnostic
        run: |
          python3 notes/post_v6_reset_2026-09-26/paper_checks.py
          python3 notes/post_v6_reset_2026-09-26/test_basin_probe.py
          python3 notes/post_v6_reset_2026-09-26/basin_probe.py --output /tmp/basin-results.json
          python3 notes/post_v6_reset_2026-09-26/verify_basin_results.py notes/post_v6_reset_2026-09-26/basin_results.json /tmp/basin-results.json
      - name: Preserve consolidation verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefix-and-basins-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/prefix-optimality-audit.log
            /tmp/sibling-basin-audit.log
            /tmp/basin-results.json
          if-no-files-found: ignore
      - name: Audit last-exponent transport and replay inverse-word checks
        run: |
          set -o pipefail
          (cd lean && lake env lean ../notes/post_v6_basin_transport_2026-09-26/DependencyAudit.lean) | tee /tmp/last-exponent-audit.log
          python3 -O notes/post_v6_basin_transport_2026-09-26/transport_probe.py --output /tmp/last-exponent-results.json
          cmp notes/post_v6_basin_transport_2026-09-26/transport_results.json /tmp/last-exponent-results.json
          python3 -O notes/post_v6_basin_transport_2026-09-26/local_coupling_probe.py --output /tmp/local-coupling-results.json
          cmp notes/post_v6_basin_transport_2026-09-26/local_coupling_results.json /tmp/local-coupling-results.json
      - name: Preserve inverse-word transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverse-word-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/last-exponent-audit.log
            /tmp/last-exponent-results.json
            /tmp/local-coupling-results.json
          if-no-files-found: ignore
      - name: Audit signed transport and replay exact arithmetic
        run: |
          set -o pipefail
          (cd lean && lake env lean ../notes/post_v6_signed_mass_2026-09-26/DependencyAudit.lean) | tee /tmp/signed-transport-audit.log
          python3 -O notes/post_v6_signed_mass_2026-09-26/check_signed_transport.py --output /tmp/signed-results.json
          cmp notes/post_v6_signed_mass_2026-09-26/signed_results.json /tmp/signed-results.json
      - name: Preserve signed transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/signed-transport-audit.log
            /tmp/signed-results.json
          if-no-files-found: ignore
